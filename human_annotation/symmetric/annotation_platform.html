<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opinion Alignment Study</title>
<style>
  :root{
    --paper:#EEF0E6;
    --paper-deep:#E2E5D6;
    --ink:#1C1E16;
    --ink-soft:#63665A;
    --line:#CBCEBC;
    --teal:#2F5D57;
    --teal-dark:#1E3E3A;
    --teal-soft:#DCE8E4;
    --amber:#C98A2C;
    --amber-soft:#F3E1BB;
    --white:#FFFFFF;
    --radius:12px;
    --shadow:0 1px 2px rgba(28,30,22,.08),0 6px 16px rgba(28,30,22,.07);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .topbar{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--paper);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  .topbar h1{font-family:var(--serif);font-size:19px;margin:0;letter-spacing:.2px;}
  .topbar .tag{font-family:var(--mono);font-size:10.5px;color:var(--teal-dark);background:var(--teal-soft);padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .topbar .spacer{flex:1;}
  .progress-wrap{max-width:1100px;margin:0 auto;padding:10px 20px 0;}
  .progress-track{height:6px;background:var(--paper-deep);border-radius:6px;overflow:hidden;margin:6px 0 2px;}
  .progress-fill{height:100%;background:var(--teal);transition:width .2s;}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .stage{max-width:1100px;margin:0 auto;padding:20px 20px 90px;}
  .narrow{max-width:760px;margin:0 auto;}

  .dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;background:var(--white);cursor:pointer;transition:.15s;}
  .dropzone.drag{border-color:var(--teal);background:var(--teal-soft);}
  .dropzone h2{font-family:var(--serif);font-size:22px;margin:0 0 8px;}
  .dropzone p{color:var(--ink-soft);font-size:14px;margin:4px 0;}
  .error-msg{background:#F6DEDC;border:1px solid #D99C97;color:#7A2C24;border-radius:8px;padding:12px 14px;font-size:13px;margin-top:14px;}
  .note{background:var(--amber-soft);border:1px solid #E2C27F;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:14px;}

  .btn{font-family:var(--sans);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--white);color:var(--ink);padding:10px 18px;border-radius:8px;cursor:pointer;}
  .btn:hover{border-color:var(--teal);}
  .btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-small{font-size:12px;padding:6px 12px;}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;}
  h2.section-title{font-family:var(--serif);font-size:22px;margin:0 0 10px;}
  .card p,.card li{font-size:14.5px;line-height:1.6;}
  .card ul{padding-left:20px;}

  .situation-card{background:var(--teal-dark);color:#fff;border:none;}
  .situation-card .eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#BFE0D8;margin-bottom:8px;}
  .situation-card p{font-size:16px;line-height:1.55;margin:0;}

  .opinions{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .op-card{margin-bottom:0;}
  .op-card .olabel{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .op-card .badge{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:13px;}
  .op-a .badge{background:var(--teal);}
  .op-b .badge{background:var(--amber);}
  .op-a{border-top:4px solid var(--teal);}
  .op-b{border-top:4px solid var(--amber);}
  .op-card .otext{font-size:15px;line-height:1.65;white-space:pre-wrap;}

  .rate-card{margin-top:14px;}
  .question{font-family:var(--serif);font-size:19px;margin:0 0 16px;}
  .question .b{color:#9A6512;} .question .a{color:var(--teal);}
  .slider-row{display:flex;align-items:center;gap:18px;}
  .slider-box{flex:1;}
  .value-pill{font-family:var(--mono);font-size:22px;font-weight:700;min-width:76px;text-align:center;padding:8px 10px;border-radius:10px;background:var(--paper-deep);color:var(--ink-soft);}
  .value-pill.set{background:var(--amber-soft);color:var(--ink);}
  /* Custom slider: the thumb stays hidden until the first click (no default value). */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;margin:0;height:28px;background:transparent;cursor:pointer;}
  input[type=range]:focus{outline:none;}
  input[type=range]:focus-visible{outline:2px solid var(--teal);outline-offset:4px;border-radius:6px;}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--paper-deep);box-shadow:inset 0 0 0 1px var(--line);}
  input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--paper-deep);box-shadow:inset 0 0 0 1px var(--line);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:content-box;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--amber);border:3px solid #fff;box-shadow:0 0 0 1px var(--amber),var(--shadow);}
  input[type=range]::-moz-range-thumb{box-sizing:content-box;width:16px;height:16px;border-radius:50%;background:var(--amber);border:3px solid #fff;box-shadow:0 0 0 1px var(--amber),var(--shadow);}
  input[type=range].untouched::-webkit-slider-thumb{opacity:0;}
  input[type=range].untouched::-moz-range-thumb{opacity:0;}
  .ticks{display:flex;justify-content:space-between;margin-top:4px;}
  .ticks button{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:none;border:none;padding:4px 0;width:22px;overflow:visible;white-space:nowrap;display:flex;justify-content:center;cursor:pointer;border-radius:6px;}
  .ticks button:hover{color:var(--ink);}
  .ticks button.on{color:var(--ink);font-weight:700;text-decoration:underline 2px var(--amber);text-underline-offset:4px;}
  .anchors{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .unset-hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}

  details.rubric{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
  details.rubric summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--teal-dark);}
  table.rubric-table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13.5px;line-height:1.5;}
  table.rubric-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.rubric-table td:first-child{font-family:var(--mono);white-space:nowrap;font-weight:700;width:1%;}
  table.rubric-table .name{font-weight:600;}

  textarea{width:100%;font-family:var(--sans);font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical;min-height:38px;}
  .field-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:16px 0 6px;display:block;}

  .row-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap;}
  .kbd-hint{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}

  .hero-result{background:var(--teal-dark);color:#fff;border-radius:var(--radius);padding:40px 26px;text-align:center;}
  .hero-result .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#BFE0D8;}
  .hero-result h2{font-family:var(--serif);font-size:30px;margin:10px 0 6px;}
  .hero-result p{color:#DCEAE6;font-size:14.5px;line-height:1.6;}
  .hero-result .btn{margin-top:14px;}

  @media (max-width:820px){
    .opinions{grid-template-columns:1fr;}
    .topbar{padding:12px 16px;}
    .stage,.progress-wrap{padding-left:16px;padding-right:16px;}
    .ticks button{font-size:10px;}
    .slider-row{flex-direction:column;align-items:stretch;gap:10px;}
    .value-pill{align-self:center;}
    .card{padding:16px;}
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>Opinion Alignment Study</h1>
  <span class="tag" id="who-tag">load your file to begin</span>
  <span class="spacer"></span>
  <button class="btn btn-small" id="save-btn" style="display:none">Download progress</button>
</div>
<div id="progress-slot"></div>
<div id="stage" class="stage"></div>

<script>
const REQUIRED_COLS = ['annotator_id','dataset','position','item_id','situation','opinion_a','opinion_b'];
const STORAGE_PREFIX = 'symmetric-annotation:v1:';
const RUBRIC = [
  ['1.0','Full alignment','Opinion B has essentially the same overall stance as Opinion A: the same direction, the same degree of support or opposition, and the same relevant ambivalence or qualifications. Differences in values, reasons, emphasis or wording are minor and do not materially change the position.'],
  ['0.7 – 0.9','Strong alignment','Opinion B substantially shares Opinion A\'s stance. It may differ in the strength of its position, in how it balances competing considerations, or in its values and reasons, but the main position is clearly aligned.'],
  ['0.4 – 0.6','Partial alignment','The opinions share some meaningful aspects of their stance but also differ in important ways, e.g. agreeing on one side of the issue while disagreeing on another, having different degrees of ambivalence, or reaching similar conclusions while weighing competing considerations very differently.'],
  ['0.1 – 0.3','Weak alignment','The opinions largely differ in their overall stance, including the way they resolve or balance competing considerations.'],
  ['0.0','No alignment','The opinions have fundamentally incompatible stances.']
];

const APP = {
  items: [],
  answers: {},
  current: 0,
  fileName: '',
  storageKey: null,
  shownAt: null
};
const stage = document.getElementById('stage');
const progressSlot = document.getElementById('progress-slot');
const saveBtn = document.getElementById('save-btn');
saveBtn.addEventListener('click', downloadCsv);

function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function storageGet(key){ try{ return window.localStorage.getItem(key); }catch(e){ return null; } }
function storageSet(key,val){ try{ window.localStorage.setItem(key,val); return true; }catch(e){ return false; } }
function storageDel(key){ try{ window.localStorage.removeItem(key); }catch(e){} }

function persist(){
  if(!APP.storageKey) return;
  storageSet(APP.storageKey, JSON.stringify({answers:APP.answers, current:APP.current, savedAt:new Date().toISOString()}));
}

function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c!=='\r') field+=c;
    }
  }
  if(field.length || row.length){row.push(field);rows.push(row);}
  return rows.filter(r => r.some(v=>v!==''));
}

function csvField(v){
  const s = v==null ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function renderUpload(error){
  progressSlot.innerHTML='';
  saveBtn.style.display='none';
  stage.innerHTML = `
    <div class="narrow">
      <div class="dropzone" id="dz">
        <h2>Load your annotation file</h2>
        <p>Drag &amp; drop the <b>.csv</b> file you received here, or click to choose it.</p>
        <p style="font-size:12.5px">Nothing is uploaded anywhere: the file stays on your computer.</p>
        <input type="file" id="file-input" accept=".csv,text/csv" style="display:none">
      </div>
      ${error ? `<div class="error-msg">${escapeHtml(error)}</div>` : ''}
    </div>`;
  const dz = document.getElementById('dz');
  const input = document.getElementById('file-input');
  dz.addEventListener('click', () => input.click());
  input.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag');
    if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

async function handleFile(file){
  let rows;
  try{ rows = parseCsv(await file.text()); }
  catch(e){ renderUpload('Could not read that file: ' + e.message); return; }
  if(rows.length < 2){ renderUpload('That file has no items in it.'); return; }

  const headers = rows[0].map(h => h.trim());
  const missing = REQUIRED_COLS.filter(c => !headers.includes(c));
  if(missing.length){
    renderUpload(`This does not look like an annotation file (missing column${missing.length>1?'s':''}: ${missing.join(', ')}). ` +
                 `If you were sent a ratings file by mistake, ask for your annotation file.`);
    return;
  }
  const items = rows.slice(1).map(r => {
    const o = {}; headers.forEach((h,i) => { o[h] = r[i]==null ? '' : r[i]; }); return o;
  }).sort((a,b) => Number(a.position) - Number(b.position));

  const ids = new Set(items.map(it => it.item_id));
  if(ids.size !== items.length){ renderUpload('The file contains duplicated item ids; please ask for a fresh copy.'); return; }
  const annotators = new Set(items.map(it => it.annotator_id));
  if(annotators.size !== 1){ renderUpload('The file mixes several annotator ids; please ask for your own file.'); return; }

  APP.items = items;
  APP.fileName = file.name;
  APP.answers = {};
  APP.current = 0;
  // Keyed by annotator and item list, so a different assignment never resumes this progress.
  const fp = items.map(it => it.item_id).join('|');
  let h = 0; for(let i=0;i<fp.length;i++){ h = (h*31 + fp.charCodeAt(i)) | 0; }
  APP.storageKey = `${STORAGE_PREFIX}${items[0].annotator_id}:${(h>>>0).toString(16)}`;
  document.getElementById('who-tag').textContent = `${items[0].annotator_id} · ${items.length} items`;

  let saved = null;
  try{ saved = JSON.parse(storageGet(APP.storageKey) || 'null'); }catch(e){ saved = null; }
  const nDone = saved ? Object.keys(saved.answers||{}).filter(k => ids.has(k)).length : 0;
  renderIntro(nDone > 0 ? saved : null, nDone);
}

function rubricTable(){
  return `<table class="rubric-table">${RUBRIC.map(([v,n,d]) =>
    `<tr><td>${v}</td><td><span class="name">${n}.</span> ${escapeHtml(d)}</td></tr>`).join('')}</table>`;
}

function renderIntro(saved, nDone){
  progressSlot.innerHTML='';
  const n = APP.items.length;
  const labels = [...new Set(APP.items.map(it => (it.context_label || 'Situation').toLowerCase()))];
  const context = labels.map(l => (/^[aeiou]/.test(l) ? 'an ' : 'a ') + l).join(' (or ') + (labels.length > 1 ? ')' : '');
  stage.innerHTML = `
    <div class="narrow">
      <div class="card">
        <h2 class="section-title">Instructions</h2>
        <p>Each screen shows <b>${escapeHtml(context)}</b> and two opinions about it, labelled
           <b>Opinion A</b> and <b>Opinion B</b>. Your task is to rate
           <b>how much Opinion B aligns with Opinion A</b>, on a scale from <b>0</b> (no alignment) to <b>1</b> (full alignment),
           in steps of 0.1.</p>
        <ul>
          <li>Judge the <b>stance</b>: its direction (for, against, mixed), its strength, and any ambivalence or qualifications it expresses.</li>
          <li>Do <b>not</b> judge writing quality, length, fluency, or whether you personally agree with either opinion.</li>
          <li>There are no right or wrong answers; we are interested in your own judgment. Treat every screen as a separate judgment.</li>
        </ul>
        <p>Use this guide for the scale (it is also available on every screen):</p>
        ${rubricTable()}
      </div>
      <div class="card">
        <h2 class="section-title">Practicalities</h2>
        <ul>
          <li>There are <b>${n} items</b>. Plan roughly ${Math.round(n*35/60)}–${Math.round(n*50/60)} minutes; short breaks are fine.</li>
          <li>Your progress is saved automatically in this browser. If you close the page, open it again in the <b>same browser</b> and load the same file to continue. Private/incognito windows do not keep progress.</li>
          <li>You can go back to fix a rating you just gave, but please do not go back to compare items.</li>
          <li>When you are done, click <b>Download ratings</b> and send us the downloaded file. You can also download your progress at any time with the button at the top right.</li>
        </ul>
      </div>
      <div class="row-actions">
        <button class="btn" id="back-upload">Choose a different file</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${saved ? `<button class="btn" id="restart">Start over</button>
                     <button class="btn btn-primary" id="resume">Resume (${nDone}/${n} done)</button>`
                  : `<button class="btn btn-primary" id="start">Start</button>`}
        </div>
      </div>
    </div>`;
  document.getElementById('back-upload').onclick = () => renderUpload();
  if(saved){
    document.getElementById('resume').onclick = () => {
      APP.answers = saved.answers || {};
      const firstOpen = APP.items.findIndex(it => !APP.answers[it.item_id]);
      APP.current = firstOpen === -1 ? APP.items.length - 1 : firstOpen;
      begin();
    };
    document.getElementById('restart').onclick = () => {
      if(!confirm('Discard the saved ratings in this browser and start from the first item?')) return;
      storageDel(APP.storageKey); APP.answers = {}; APP.current = 0; begin();
    };
  } else {
    document.getElementById('start').onclick = () => begin();
  }
}

function begin(){
  saveBtn.style.display='';
  if(APP.items.every(it => APP.answers[it.item_id])) renderDone(); else renderItem();
}

function renderProgress(){
  const n = APP.items.length;
  const done = APP.items.filter(it => APP.answers[it.item_id]).length;
  progressSlot.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-label"><span>Item ${APP.current+1} of ${n}</span><span>${done} rated</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${100*done/n}%"></div></div>
    </div>`;
}

function renderItem(){
  const it = APP.items[APP.current];
  const prev = APP.answers[it.item_id];
  renderProgress();
  const ticks = Array.from({length:11}, (_,i) => (i/10).toFixed(1));
  stage.innerHTML = `
    <div class="card situation-card">
      <div class="eyebrow">${escapeHtml(it.context_label || 'Situation')}</div>
      <p>${escapeHtml(it.situation)}</p>
    </div>
    <div class="opinions">
      <div class="card op-card op-a"><div class="olabel"><span class="badge">A</span>Opinion A</div><div class="otext">${escapeHtml(it.opinion_a.trim())}</div></div>
      <div class="card op-card op-b"><div class="olabel"><span class="badge">B</span>Opinion B</div><div class="otext">${escapeHtml(it.opinion_b.trim())}</div></div>
    </div>
    <div class="card rate-card">
      <p class="question">How much does <span class="b">Opinion B</span> align with <span class="a">Opinion A</span>?</p>
      <div class="slider-row">
        <div class="slider-box">
          <input type="range" id="slider" min="0" max="1" step="0.1" value="${prev ? prev.rating : 0.5}" class="${prev ? '' : 'untouched'}" aria-label="Alignment of Opinion B with Opinion A, from 0 to 1">
          <div class="ticks" id="ticks">${ticks.map(t => `<button type="button" data-v="${t}">${t}</button>`).join('')}</div>
          <div class="anchors"><span>No alignment</span><span>Partial</span><span>Full alignment</span></div>
        </div>
        <div class="value-pill ${prev ? 'set' : ''}" id="value">${prev ? Number(prev.rating).toFixed(1) : '–'}</div>
      </div>
      <div class="unset-hint" id="unset-hint" ${prev ? 'style="display:none"' : ''}>Click or drag on the scale to give your rating.</div>
      <details class="rubric"><summary>Scoring guide</summary>${rubricTable()}</details>
      <label class="field-label" for="comment">Comment (optional: e.g. an unclear or problematic item)</label>
      <textarea id="comment" rows="1">${escapeHtml(prev ? prev.comment : '')}</textarea>
      <div class="row-actions">
        <button class="btn" id="prev" ${APP.current===0 ? 'disabled' : ''}>&larr; Back</button>
        <span class="kbd-hint">&larr;/&rarr; on the slider adjust · Enter = next</span>
        <button class="btn btn-primary" id="next" ${prev ? '' : 'disabled'}>${APP.current === APP.items.length-1 ? 'Finish' : 'Next &rarr;'}</button>
      </div>
    </div>`;

  const slider = document.getElementById('slider');
  const valueEl = document.getElementById('value');
  const nextBtn = document.getElementById('next');
  let touched = !!prev;

  function setValue(v){
    slider.value = v;
    touched = true;
    slider.classList.remove('untouched');
    valueEl.textContent = Number(slider.value).toFixed(1);
    valueEl.classList.add('set');
    document.getElementById('unset-hint').style.display='none';
    document.querySelectorAll('#ticks button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === Number(slider.value)));
    nextBtn.disabled = false;
  }
  if(prev) setValue(prev.rating);
  slider.addEventListener('pointerdown', () => setTimeout(() => setValue(slider.value), 0));
  slider.addEventListener('input', () => setValue(slider.value));
  slider.addEventListener('keydown', e => { if(e.key.startsWith('Arrow')) setTimeout(() => setValue(slider.value), 0); });
  document.querySelectorAll('#ticks button').forEach(b => b.addEventListener('click', () => setValue(b.dataset.v)));

  document.getElementById('prev').onclick = () => { commit(false); APP.current--; renderItem(); window.scrollTo(0,0); };
  nextBtn.onclick = () => advance();
  APP.shownAt = performance.now();
  APP.keyHandler = e => {
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON' && touched) { e.preventDefault(); advance(); }
  };

  function commit(requireRating){
    const elapsed = performance.now() - APP.shownAt;
    const old = APP.answers[it.item_id];
    if(!touched){
      if(old) old.rt_ms += elapsed;
      persist();
      return !requireRating;
    }
    const rating = Number(Number(slider.value).toFixed(1));
    APP.answers[it.item_id] = {
      rating,
      first_rating: old ? old.first_rating : rating,
      rt_ms: (old ? old.rt_ms : 0) + elapsed,
      n_visits: (old ? old.n_visits : 0) + 1,
      comment: document.getElementById('comment').value.trim(),
      rated_at: new Date().toISOString()
    };
    persist();
    return true;
  }
  function advance(){
    if(!commit(true)) return;
    if(APP.current < APP.items.length - 1){ APP.current++; renderItem(); window.scrollTo(0,0); }
    else if(APP.items.every(x => APP.answers[x.item_id])) renderDone();
    else { APP.current = APP.items.findIndex(x => !APP.answers[x.item_id]); renderItem(); }
  }
}
document.addEventListener('keydown', e => { if(APP.keyHandler) APP.keyHandler(e); });

function renderDone(){
  APP.keyHandler = null;
  renderProgress();
  progressSlot.querySelector('.progress-label span').textContent = 'All items rated';
  stage.innerHTML = `
    <div class="narrow">
      <div class="hero-result">
        <div class="eyebrow">Complete</div>
        <h2>Thank you!</h2>
        <p>You rated all ${APP.items.length} items. Please download your ratings and send the file back to us.</p>
        <button class="btn btn-primary" id="dl" style="background:var(--amber);border-color:var(--amber)">Download ratings</button>
        <p style="font-size:12.5px;margin-top:14px">File name: <code>${escapeHtml(outputName(true))}</code></p>
      </div>
      <div class="row-actions">
        <button class="btn" id="review">&larr; Back to the last item</button>
      </div>
      <div class="note">Your ratings stay saved in this browser, so you can download them again later by loading the same file.</div>
    </div>`;
  document.getElementById('dl').onclick = downloadCsv;
  document.getElementById('review').onclick = () => { APP.current = APP.items.length - 1; renderItem(); };
}

function outputName(complete){
  const it = APP.items[0];
  return `ratings_${it.annotator_id}${complete ? '' : '_partial'}.csv`;
}

function downloadCsv(){
  const cols = ['annotator_id','dataset','position','item_id','rating','first_rating','rt_seconds','n_visits','comment','rated_at','source_file'];
  const lines = [cols.join(',')];
  APP.items.forEach(it => {
    const a = APP.answers[it.item_id];
    lines.push([
      it.annotator_id, it.dataset, it.position, it.item_id,
      a ? a.rating.toFixed(1) : '', a ? a.first_rating.toFixed(1) : '',
      a ? (a.rt_ms/1000).toFixed(1) : '', a ? a.n_visits : '',
      a ? a.comment : '', a ? a.rated_at : '', APP.fileName
    ].map(csvField).join(','));
  });
  const allDone = APP.items.every(it => APP.answers[it.item_id]);
  const blob = new Blob([lines.join('\n') + '\n'], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = outputName(allDone);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

renderUpload();
</script>
</body>
</html>
